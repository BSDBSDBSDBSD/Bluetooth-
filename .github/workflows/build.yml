name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log; EC=${PIPESTATUS[0]}
          if [ $EC -ne 0 ]; then
            echo "=== BUILD FAILED - Errors ==="
            grep -E "^e:|error:|FAILED|Exception|Unresolved|Could not" build.log | head -40
            exit $EC
          fi
          APK=$(find . -name "app-debug.apk" | head -1)
          echo "APK: $APK"
      - name: Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name "app-debug.apk" | head -1)
          TAG="v1.0-build-${{ github.run_number }}"
          gh release create "$TAG" --title "גרסה ${{ github.run_number }}" --notes "APK מוכן" "$APK#app-debug.apk" 2>&1 || echo "Release may already exist"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30
